name: CI

# Gates every PR (and pushes to main) on the checks the project now maintains:
# rustfmt, clippy, build, and the full test suite. release.yml only builds the
# three shipped binaries; this also formats/lints/tests everything so a
# regression is caught before it reaches the rolling release.
#
# clippy runs WITHOUT `-D warnings`: the crate-level deny(unwrap_used/
# expect_used) gates already make those hard errors, while the remaining style
# lints (complex types, doc formatting, …) stay non-fatal warnings until they're
# cleaned up. So clippy here enforces "no new unwrap/expect in shipping code"
# without red-X'ing on pre-existing style debt.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Newer PR commits supersede older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    # 24.04, not 22.04: the master↔node wire tests assert on curl's
    # `--write-out` captures (`%{certs}` needs curl 7.88, `%header{}` 7.84).
    # 22.04 ships 7.81, so those tests skipped themselves and the response-
    # authentication path was never actually exercised in CI. Debian 12 — the
    # deployment target — ships 7.88, so 24.04 is also the closer match.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # Not -D warnings — the crate-level deny(unwrap_used/expect_used) is the
        # hard gate; style lints stay as (non-fatal) warnings for now.
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Build (release — mirrors the rolling release)
        run: cargo build --workspace --release

      # The self-service exporter is the ONE binary CI was not covering, and it
      # is the one that runs on somebody else's server. It is built for
      # x86_64-unknown-linux-musl so it is static and works on any Linux
      # regardless of glibc age — a target with real differences from the host
      # build above, and until now it was compiled for the first time inside
      # release.yml, which only runs on a `v*` tag. So a dependency that does not
      # support musl would be discovered at release time, with the tag already
      # pushed and no binaries to ship.
      #
      # This is not hypothetical: `rustix` arrived as a dependency of
      # hyperion-import (for the process-group kill in the export deadlines) and
      # nothing here would have exercised it under musl.
      - name: Build the static musl exporter
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl -p hyperion-export
          file target/x86_64-unknown-linux-musl/release/hyperion-export

      # The bootstrap the operator pipes to `sudo bash` on their source server is
      # assembled from a prelude plus this asset. A syntax error in it compiles
      # perfectly well and is first discovered by root on a production box.
      # `web_e2e` already pipes the RENDERED script through `bash -n`; this
      # checks the asset on its own so a break is attributed to the right file.
      - name: Syntax-check the import runner
        run: bash -n bin/hyperion-web/assets/import-runner.sh
