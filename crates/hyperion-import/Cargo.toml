[package]
name = "hyperion-import"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
rand.workspace = true
# Bundle integrity. `tar tf` exits 0 on a zero-padded truncation and silently
# drops whole sites, so the digest is the only real check — see bundle::seal.
sha2.workspace = true
# `killpg`: a timed-out dump has to be stopped along with whatever it forked,
# and there is no `kill` BINARY on a minimal Debian — see `proc::kill_group`.
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
