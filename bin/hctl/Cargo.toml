[package]
name = "hctl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hctl"
path = "src/main.rs"

[dependencies]
hyperion-rpc = { path = "../../crates/hyperion-rpc" }
hyperion-rpc-client = { path = "../../crates/hyperion-rpc-client" }
hyperion-import = { path = "../../crates/hyperion-import" }
hyperion-types = { path = "../../crates/hyperion-types" }
hyperion-validate = { path = "../../crates/hyperion-validate" }
tokio = { workspace = true }
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# `hctl remote` — HTTP client for the /api/v1 Bearer API. rustls (no OpenSSL)
# to match the rest of the workspace; blocking off (main is async).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
